<!DOCTYPE html>
<html>
    <head>
        <title>Jogo da adivinhação</title>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
        <link href="style.css" rel="stylesheet">
    </head>
    <body>
        <div class="game-template">
            <h1>Jogo da adivinhação</h1>
            <button id="start-game">Iniciar jogo</button>

            <input type="number" id="numero" min="0" max="99" placeholder="Digite um número">

            <button id="guess-number">Adivinhar</button>

            <p id="resultado"></p>
            <div id="historico"></div>
        </div>

        <script src="main.js"></script>
    </body>
</html>
